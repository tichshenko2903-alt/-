<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ СОБЕРИ ПК | Пазл-Челлендж</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Rajdhani', sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #2d1b69 100%);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    padding: 20px;
  }
  
  .container { max-width: 1100px; margin: 0 auto; }
  
  .header { text-align: center; margin-bottom: 30px; }
  
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    background: linear-gradient(90deg, #00f0ff, #ff00e5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  
  .subtitle {
    font-size: 1.3rem;
    color: #b8bcff;
    letter-spacing: 0.2em;
  }
  
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  
  .stat-card {
    background: rgba(0,240,255,0.1);
    border: 2px solid #00f0ff;
    border-radius: 15px;
    padding: 15px 30px;
    min-width: 150px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  
  .stat-label {
    font-size: 0.9rem;
    color: #b8bcff;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  
  .stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    color: #00f0ff;
    margin-top: 5px;
  }
  
  .stat-value.timer { color: #ff00e5; }
  .stat-value.moves { color: #ffd700; }
  
  .game-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 30px;
  }
  
  @media (max-width: 900px) {
    .game-area { grid-template-columns: 1fr; }
  }
  
  .panel {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
  }
  
  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem;
    color: #00f0ff;
    margin-bottom: 20px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    max-width: 450px;
    margin: 0 auto;
    aspect-ratio: 4/3;
    background: #0a0e27;
    border: 3px solid #00f0ff;
    border-radius: 12px;
    padding: 6px;
  }
  
  .puzzle-cell {
    aspect-ratio: 4/3;
    background: rgba(0,0,0,0.4);
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .puzzle-cell:hover {
    border-color: #00f0ff;
    box-shadow: 0 0 15px rgba(0,240,255,0.4);
    background: rgba(0,240,255,0.05);
  }
  
  .puzzle-cell.filled {
    border: 2px solid #00f0ff;
    background: #1a1f4e;
  }
  
  .puzzle-cell.correct {
    border-color: #00ff88;
    box-shadow: 0 0 15px rgba(0,255,136,0.5);
  }
  
  .puzzle-cell svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  
  .pieces-pool {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 450px;
    margin: 0 auto;
  }
  
  .piece-item {
    aspect-ratio: 4/3;
    border: 2px solid rgba(255,0,229,0.5);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    background: rgba(255,0,229,0.05);
  }
  
  .piece-item:hover {
    transform: scale(1.05);
    border-color: #ff00e5;
    box-shadow: 0 0 20px rgba(255,0,229,0.5);
  }
  
  .piece-item.selected {
    border-color: #ffd700;
    box-shadow: 0 0 25px rgba(255,215,0,0.8);
    transform: scale(1.1);
    z-index: 10;
  }
  
  .piece-item.placed {
    opacity: 0.2;
    pointer-events: none;
    filter: grayscale(1);
  }
  
  .piece-item svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  
  .piece-number {
    position: absolute;
    top: 4px;
    left: 4px;
    background: rgba(0,0,0,0.8);
    color: #00f0ff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    z-index: 10;
    border: 1px solid #00f0ff;
  }
  
  .controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  
  .btn {
    font-family: 'Orbitron', sans-serif;
    padding: 15px 30px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.3s;
  }
  
  .btn-primary {
    background: linear-gradient(90deg, #00f0ff, #00cc6a);
    color: #0a0e27;
    box-shadow: 0 5px 20px rgba(0,240,255,0.4);
  }
  
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,240,255,0.6);
  }
  
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
  }
  
  .btn-secondary:hover {
    background: rgba(255,255,255,0.2);
    border-color: #ff00e5;
  }
  
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  
  .modal.active { display: flex; animation: fadeIn 0.5s; }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .modal-content {
    background: linear-gradient(135deg, #1a1f4e, #2d1b69);
    border: 3px solid #00f0ff;
    border-radius: 25px;
    padding: 40px;
    max-width: 500px;
    text-align: center;
    animation: slideUp 0.5s;
  }
  
  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  .modal-icon {
    font-size: 5rem;
    margin-bottom: 20px;
    animation: bounce 1s infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  
  .modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    color: #00f0ff;
    margin-bottom: 20px;
  }
  
  .modal-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 30px 0;
  }
  
  .modal-stat {
    background: rgba(0,240,255,0.1);
    border-radius: 10px;
    padding: 15px;
  }
  
  .modal-stat-label {
    font-size: 0.9rem;
    color: #b8bcff;
  }
  
  .modal-stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    color: #ffd700;
    margin-top: 5px;
  }
  
  .hint-box {
    background: rgba(255,215,0,0.1);
    border: 2px solid #ffd700;
    border-radius: 15px;
    padding: 20px;
    margin-top: 20px;
    text-align: center;
    display: none;
  }
  
  .hint-title {
    color: #ffd700;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 10px;
  }
  
  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: -1;
    overflow: hidden;
  }
  
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: #00f0ff;
    border-radius: 50%;
    animation: float 15s infinite linear;
    box-shadow: 0 0 10px #00f0ff;
  }
  
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="header">
    <h1 class="title">️ СОБЕРИ ПК</h1>
    <p class="subtitle">ПАЗЛ-ЧЕЛЛЕНДЖ • 9 ФРАГМЕНТОВ</p>
  </div>
  
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">⏱️ Время</div>
      <div class="stat-value timer" id="timer">00:00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"> Ходы</div>
      <div class="stat-value moves" id="moves">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">✅ Собрано</div>
      <div class="stat-value" id="progress">0/9</div>
    </div>
  </div>
  
  <div class="game-area">
    <div class="panel">
      <div class="panel-title">🎯 Поле сборки</div>
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>
    
    <div class="panel">
      <div class="panel-title">🧩 Фрагменты</div>
      <div class="pieces-pool" id="piecesPool"></div>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startGame()">🚀 Новая игра</button>
    <button class="btn btn-secondary" onclick="showHint()">💡 Подсказка</button>
    <button class="btn btn-secondary" onclick="resetGame()">🔄 Сброс</button>
  </div>
  
  <div class="hint-box" id="hintBox">
    <div class="hint-title">💡 ПОДСКАЗКА</div>
    <p>Собери настольный компьютер: монитор слева, системный блок справа, клавиатура и мышь внизу</p>
  </div>
</div>

<div class="modal" id="winModal">
  <div class="modal-content">
    <div class="modal-icon">🏆</div>
    <h2 class="modal-title">ПОБЕДА!</h2>
    <p>Ты собрал компьютер!</p>
    <div class="modal-stats">
      <div class="modal-stat">
        <div class="modal-stat-label">Время</div>
        <div class="modal-stat-value" id="finalTime">00:00</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-label">Ходы</div>
        <div class="modal-stat-value" id="finalMoves">0</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="closeModal(); startGame();">Играть снова</button>
  </div>
</div>

<script>
// SVG КОМПЬЮТЕРА (inline, без data URI — работает везде!)
const pcSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Фон -->
  <rect fill="#f5f5f5" width="400" height="300"/>
  
  <!-- Монитор рамка -->
  <rect fill="#c0c0c0" x="30" y="25" width="220" height="150" rx="6"/>
  <rect fill="#2a2a2a" x="35" y="30" width="210" height="140" rx="4"/>
  <!-- Экран -->
  <rect fill="#1a1a1a" x="42" y="37" width="196" height="126"/>
  <!-- Блик на экране -->
  <polygon fill="#333" points="50,45 120,45 80,155 50,155" opacity="0.5"/>
  <polygon fill="#2a2a2a" points="130,45 180,45 140,155 90,155" opacity="0.4"/>
  <!-- Подставка монитора -->
  <rect fill="#888" x="130" y="175" width="20" height="25"/>
  <rect fill="#666" x="100" y="200" width="80" height="8" rx="2"/>
  
  <!-- Системный блок -->
  <rect fill="#d0d0d0" x="280" y="25" width="90" height="200" rx="5"/>
  <rect fill="#b0b0b0" x="285" y="30" width="80" height="190" rx="3"/>
  <!-- Детали системника -->
  <rect fill="#555" x="295" y="40" width="60" height="12" rx="2"/>
  <rect fill="#888" x="295" y="60" width="60" height="8" rx="2"/>
  <rect fill="#888" x="295" y="75" width="60" height="8" rx="2"/>
  <rect fill="#888" x="295" y="90" width="60" height="8" rx="2"/>
  <rect fill="#888" x="295" y="105" width="60" height="8" rx="2"/>
  <!-- Кнопка питания -->
  <rect fill="#444" x="310" y="135" width="30" height="20" rx="3"/>
  <rect fill="#666" x="315" y="140" width="20" height="10" rx="2"/>
  <!-- Низ системника -->
  <rect fill="#555" x="285" y="205" width="80" height="10" rx="2"/>
  
  <!-- Клавиатура -->
  <rect fill="#e8e8e8" x="35" y="225" width="185" height="55" rx="4"/>
  <rect fill="#d0d0d0" x="40" y="230" width="175" height="45" rx="3"/>
  <!-- Клавиши -->
  <rect fill="#333" x="45" y="235" width="165" height="12" rx="1"/>
  <rect fill="#333" x="45" y="250" width="165" height="12" rx="1"/>
  <rect fill="#333" x="45" y="265" width="100" height="8" rx="1"/>
  <rect fill="#333" x="150" y="265" width="60" height="8" rx="1"/>
  <!-- Пробел -->
  <rect fill="#555" x="70" y="265" width="75" height="8" rx="1"/>
  
  <!-- Мышь -->
  <ellipse fill="#e8e8e8" cx="295" cy="255" rx="32" ry="22"/>
  <ellipse fill="#d0d0d0" cx="295" cy="253" rx="28" ry="18"/>
  <line x1="295" y1="238" x2="295" y2="255" stroke="#999" stroke-width="2"/>
  <ellipse fill="#999" cx="295" cy="248" rx="6" ry="8"/>
</svg>`;

// VIEWBOX ДЛЯ КАЖДОЙ ЯЧЕЙКИ (3x3 сетка на 400x300)
const viewboxes = [
  "0 0 134 100",       // 0: верх-лево
  "133 0 134 100",     // 1: верх-центр
  "266 0 134 100",     // 2: верх-право
  "0 100 134 100",     // 3: середина-лево
  "133 100 134 100",   // 4: середина-центр
  "266 100 134 100",   // 5: середина-право
  "0 200 134 100",     // 6: низ-лево
  "133 200 134 100",   // 7: низ-центр
  "266 200 134 100"    // 8: низ-право
];

// GAME STATE
let selectedPiece = null;
let moves = 0;
let seconds = 0;
let timerInterval = null;
let placedPieces = new Set();
let gameStarted = false;

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 15 + 's';
    p.style.animationDuration = (Math.random() * 10 + 10) + 's';
    if (Math.random() > 0.5) {
      p.style.background = '#ff00e5';
      p.style.boxShadow = '0 0 10px #ff00e5';
    }
    container.appendChild(p);
  }
}

function startGame() {
  moves = 0;
  seconds = 0;
  placedPieces.clear();
  selectedPiece = null;
  gameStarted = true;
  
  updateStats();
  startTimer();
  renderGrid();
  renderPieces();
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    seconds++;
    const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
    const secs = (seconds % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${mins}:${secs}`;
  }, 1000);
}

function updateStats() {
  document.getElementById('moves').textContent = moves;
  document.getElementById('progress').textContent = `${placedPieces.size}/9`;
}

function renderGrid() {
  const grid = document.getElementById('puzzleGrid');
  grid.innerHTML = '';
  
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'puzzle-cell';
    cell.dataset.index = i;
    cell.onclick = () => handleCellClick(i);
    
    if (placedPieces.has(i)) {
      cell.classList.add('filled', 'correct');
      cell.innerHTML = pcSVG.replace('<svg ', `<svg viewBox="${viewboxes[i]}" `);
    }
    
    grid.appendChild(cell);
  }
}

function renderPieces() {
  const pool = document.getElementById('piecesPool');
  pool.innerHTML = '';
  
  const shuffled = shuffle([0,1,2,3,4,5,6,7,8]);
  
  shuffled.forEach((pieceIndex) => {
    const item = document.createElement('div');
    item.className = 'piece-item';
    item.dataset.pieceIndex = pieceIndex;
    item.onclick = () => handlePieceClick(pieceIndex, item);
    
    if (placedPieces.has(pieceIndex)) {
      item.classList.add('placed');
    }
    
    if (selectedPiece === pieceIndex) {
      item.classList.add('selected');
    }
    
    item.innerHTML = pcSVG.replace('<svg ', `<svg viewBox="${viewboxes[pieceIndex]}" `);
    
    const num = document.createElement('div');
    num.className = 'piece-number';
    num.textContent = pieceIndex + 1;
    item.appendChild(num);
    
    pool.appendChild(item);
  });
}

function handlePieceClick(pieceIndex, element) {
  if (placedPieces.has(pieceIndex)) return;
  
  selectedPiece = selectedPiece === pieceIndex ? null : pieceIndex;
  renderPieces();
}

function handleCellClick(cellIndex) {
  if (!gameStarted || placedPieces.has(cellIndex) || selectedPiece === null) return;
  
  placedPieces.add(selectedPiece);
  moves++;
  selectedPiece = null;
  
  updateStats();
  renderGrid();
  renderPieces();
  
  if (placedPieces.size === 9) {
    setTimeout(checkWin, 600);
  }
}

function checkWin() {
  clearInterval(timerInterval);
  
  const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
  const secs = (seconds % 60).toString().padStart(2, '0');
  document.getElementById('finalTime').textContent = `${mins}:${secs}`;
  document.getElementById('finalMoves').textContent = moves;
  document.getElementById('winModal').classList.add('active');
}

function showHint() {
  const hint = document.getElementById('hintBox');
  hint.style.display = hint.style.display === 'none' || hint.style.display === '' ? 'block' : 'none';
}

function resetGame() {
  placedPieces.clear();
  selectedPiece = null;
  moves = 0;
  updateStats();
  renderGrid();
  renderPieces();
}

function closeModal() {
  document.getElementById('winModal').classList.remove('active');
}

// INIT
createParticles();
renderGrid();
renderPieces();
</script>

</body>
</html>
